name: Sync upstream

on:
  schedule:
    - cron: '0 4 * * *' # daily at 4am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: fetch upstream and merge
        run: |
          git remote add upstream https://github.com/git/git-scm.com.git
          git fetch upstream gh-pages
          git merge upstream/gh-pages --no-edit

      - name: restore CNAME
        run: echo 'git-scm.arcticdev.com' > CNAME

      - name: push if changed
        run: |
          git diff --quiet HEAD origin/gh-pages || git push origin gh-pages
